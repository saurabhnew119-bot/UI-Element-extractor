# mSpace (com.mli.mspace) on the local emulator. Layered over elementiq/android.properties via
# -Delementiq.config=src/test/resources/mspace/android.properties; any key can still be overridden with -Dkey=value.
appium.url=http://127.0.0.1:4724
udid=emulator-5554
appId=com.mli.mspace
appActivity=.MainActivity
noReset=true
freshLaunch=true
timeout.seconds=15
elementiq.repository=mspace/repository.json
healing.enabled=true
