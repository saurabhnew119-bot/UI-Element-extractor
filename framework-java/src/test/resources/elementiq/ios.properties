# iOS run settings (Appium + XCUITest must run on a Mac). Any key can be overridden with -Dkey=value.
appium.url=http://127.0.0.1:4723
# udid=00008110-XXXXXXXXXXXX
# device.kind=physical   (or simulator)
appId=com.example.shop
# app=builds/Shop.ipa     (device)  or builds/Shop.app (simulator)
noReset=true
timeout.seconds=15
elementiq.repository=elementiq/repository.json
healing.enabled=true
# WebDriverAgent signing for physical iPhones:
# wda.xcodeOrgId=TEAMID1234
# wda.xcodeSigningId=Apple Development
# wda.updatedBundleId=com.example.WebDriverAgentRunner
# wda.usePrebuilt=false
# wda.url=http://192.168.1.20:8100
